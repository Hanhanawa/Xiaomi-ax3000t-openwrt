name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 连接到 Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config

  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true

  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # =====================================================
    # Check build server
    # =====================================================
    - name: Check Server Performance
      run: |
        echo "========================================"
        echo " Server Performance"
        echo "========================================"

        echo "CPU physical packages:"
        cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l

        echo "CPU threads:"
        nproc

        echo "CPU:"
        cat /proc/cpuinfo | grep -m1 "model name" || true

        echo
        echo "Memory:"
        free -h

        echo
        echo "Disk:"
        df -hT

    # =====================================================
    # Checkout user repository
    # =====================================================
    - name: Checkout
      uses: actions/checkout@main

    # =====================================================
    # Free disk space
    # =====================================================
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        df -hT

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Free up disk space complete
      run: |
        echo "After freeing up disk space"
        df -hT

    # =====================================================
    # Build environment
    # =====================================================
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update

        sudo -E apt-get -qq install \
          ack \
          antlr3 \
          asciidoc \
          autoconf \
          automake \
          autopoint \
          binutils \
          bison \
          build-essential \
          bzip2 \
          ccache \
          clang \
          cmake \
          cpio \
          curl \
          device-tree-compiler \
          flex \
          gawk \
          gcc-multilib \
          g++-multilib \
          gettext \
          genisoimage \
          git \
          gperf \
          haveged \
          help2man \
          intltool \
          libc6-dev-i386 \
          libelf-dev \
          libfuse-dev \
          libglib2.0-dev \
          libgmp3-dev \
          libltdl-dev \
          libmpc-dev \
          libmpfr-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libpython3-dev \
          libreadline-dev \
          libssl-dev \
          libtool \
          llvm \
          lrzsz \
          libnsl-dev \
          ninja-build \
          p7zip \
          p7zip-full \
          patch \
          pkgconf \
          python3 \
          python3-pyelftools \
          python3-setuptools \
          qemu-utils \
          rsync \
          scons \
          squashfs-tools \
          subversion \
          swig \
          texinfo \
          uglifyjs \
          upx-ucl \
          unzip \
          vim \
          wget \
          xmlto \
          xxd \
          zlib1g-dev

        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

        sudo rm -rf \
          /etc/apt/sources.list.d/* \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/share/dotnet \
          /usr/local/graalvm \
          /usr/local/.ghcup \
          /usr/local/share/powershell \
          /usr/local/share/chromium \
          /usr/local/lib/node_modules

        sudo timedatectl set-timezone "$TZ"

        sudo chown "$USER:$GROUPS" "$GITHUB_WORKSPACE"

    # =====================================================
    # Clone OpenWrt source
    # =====================================================
    - name: Clone source code
      run: |
        git clone \
          --depth=1 \
          "$REPO_URL" \
          -b "$REPO_BRANCH" \
          openwrt

    # =====================================================
    # Load custom feeds
    # =====================================================
    - name: Load custom feeds
      run: |
        [ -e "$FEEDS_CONF" ] && \
          mv "$FEEDS_CONF" openwrt/feeds.conf.default

        chmod +x "$DIY_P1_SH"

        cd openwrt

        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    # =====================================================
    # Update feeds
    # =====================================================
    - name: Update feeds
      run: |
        cd openwrt

        ./scripts/feeds update -a

    # =====================================================
    # Install feeds
    # =====================================================
    - name: Install feeds
      run: |
        cd openwrt

        ./scripts/feeds install -a

    # =====================================================
    # Install DDNS-Go
    # =====================================================
    - name: Install ddns-go
      run: |
        cd openwrt

        rm -rf package/ddns-go

        git clone \
          --depth=1 \
          https://github.com/sirpdboy/luci-app-ddns-go.git \
          package/ddns-go

    # =====================================================
    # Install Argon
    # =====================================================
    - name: Install Argon
      run: |
        cd openwrt

        mkdir -p package/lean

        rm -rf package/lean/luci-theme-argon

        git clone \
          --depth=1 \
          -b master \
          https://github.com/jerrykuku/luci-theme-argon.git \
          package/lean/luci-theme-argon

    # =====================================================
    # Load configuration
    # =====================================================
    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files

        [ -e "$CONFIG_FILE" ] && \
          mv "$CONFIG_FILE" openwrt/.config

        chmod +x "$DIY_P2_SH"

        cd openwrt

        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    # =====================================================
    # Print important configuration
    # =====================================================
    - name: Verify configuration
      run: |
        cd openwrt

        echo "========================================"
        echo " Target"
        echo "========================================"

        grep '^CONFIG_TARGET.*=y' .config || true

        echo
        echo "========================================"
        echo " OpenClash"
        echo "========================================"

        grep -E \
          'CONFIG_PACKAGE_luci-app-openclash|CONFIG_PACKAGE_kmod-tun' \
          .config || true

        echo
        echo "========================================"
        echo " DDNS-Go"
        echo "========================================"

        grep -E \
          'CONFIG_PACKAGE_(ddns-go|luci-app-ddns-go|ddns-scripts)' \
          .config || true

        echo
        echo "========================================"
        echo " WireGuard"
        echo "========================================"

        grep -E \
          'CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard)' \
          .config || true

        echo
        echo "========================================"
        echo " PassWall / SSR"
        echo "========================================"

        grep -E \
          'PASSWALL|passwall|SSR|ssr-plus' \
          .config || true

    # =====================================================
    # SSH
    # =====================================================
    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: >
        (github.event.inputs.ssh == 'true' &&
        github.event.inputs.ssh != 'false') ||
        contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    # =====================================================
    # Defconfig + Download
    # =====================================================
    - name: Download package
      id: package
      run: |
        cd openwrt

        make defconfig

        echo "========================================"
        echo " Final package configuration"
        echo "========================================"

        grep '^CONFIG_PACKAGE_' .config | \
          grep -E \
          'openclash|ddns|wireguard|argon|turboacc' || true

        echo
        echo "========================================"
        echo " Download packages"
        echo "========================================"

        make download -j"$(nproc)" || \
        make download -j1 || \
        make download -j1 V=s

        find dl -size -1024c -exec ls -l {} \;

        find dl -size -1024c -exec rm -f {} \;

    # =====================================================
    # Compile
    # =====================================================
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt

        echo "========================================"
        echo " Compile OpenWrt"
        echo "========================================"

        echo "$(nproc) threads"

        make -j"$(nproc)" || \
        make -j1 || \
        make -j1 V=s

        echo "status=success" >> "$GITHUB_OUTPUT"

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' \
          > DEVICE_NAME

        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        fi

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    # =====================================================
    # Disk usage
    # =====================================================
    - name: Check space usage
      if: (!cancelled())
      run: |
        df -hT

    # =====================================================
    # Upload complete bin
    # =====================================================
    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: >
        steps.compile.outputs.status == 'success' &&
        env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    # =====================================================
    # Organize firmware
    # =====================================================
    - name: Organize files
      id: organize
      if: >
        env.UPLOAD_FIRMWARE == 'true' &&
        !cancelled()
      run: |
        cd openwrt/bin/targets/*/*

        rm -rf packages

        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    # =====================================================
    # Upload firmware
    # =====================================================
    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: >
        steps.organize.outputs.status == 'success' &&
        !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # =====================================================
    # Release
    # =====================================================
    - name: Generate release tag
      id: tag
      if: >
        env.UPLOAD_RELEASE == 'true' &&
        !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"

        touch release.txt

        if [ "$UPLOAD_COWTRANSFER" = true ]; then
          echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" \
            >> release.txt
        fi

        if [ "$UPLOAD_WETRANSFER" = true ]; then
          echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" \
            >> release.txt
        fi

        echo "status=success" >> "$GITHUB_OUTPUT"

    # =====================================================
    # Delete old workflow runs
    # =====================================================
    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    # =====================================================
    # Delete old releases
    # =====================================================
    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: >
        env.UPLOAD_RELEASE == 'true' &&
        !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
